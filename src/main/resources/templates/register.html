<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sign up')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="narrow">
  <h1>Sign up</h1>
  <p class="error" th:if="${error}" th:text="${error}"></p>
  <form method="post" th:action="@{/register}" class="form">
    <label class="field">Full name<input name="fullName" required></label>
    <label class="field">Email<input type="email" name="email" required></label>
    <label class="field">Password (6+ characters)<input type="password" name="password" minlength="6" required></label>
    <label class="field">Location (city/town)
      <select name="location"><option th:each="l : ${locations}" th:value="${l}" th:text="${l}" th:selected="${l == 'Batangas City'}"></option></select>
    </label>
    <label class="field">What will you do on TugmaMat?
      <select name="role">
        <option value="PROVIDER">Post leftover materials (Provider)</option>
        <option value="REQUESTER">Look for materials (Requester)</option>
      </select>
    </label>
    <button class="btn" type="submit">Sign up</button>
  </form>
  <p class="muted">Already have an account? <a th:href="@{/login}">Log in</a></p>
</main>
</body>
</html>
