<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Something went wrong')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="narrow">
  <h1 th:text="${title != null ? title : 'Sorry, something went wrong'}">Sorry, something went wrong</h1>
  <p class="muted" th:text="${message != null and !#strings.isEmpty(message) ? message : 'We could not find that page or the server had an error. Try again or go back home.'}">Message</p>
  <p class="muted" th:if="${status != null}" th:text="'Code: ' + ${status}"></p>
  <div class="actions"><a class="btn" th:href="@{/}">Back to home</a><a class="btn ghost" th:href="@{/listings}">Materials</a></div>
</main>
</body>
</html>
