<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Pickups')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
  <h1>Pickups</h1>
  <p class="muted pk-sub">People who took pieces from your listings. Confirm once they have collected them.</p>

  <p class="notice ok" th:if="${param.done != null and param.done[0] == 'pickup'}">Pickup confirmed.</p>
  <p class="notice ok" th:if="${param.done != null and param.done[0] == 'cancel'}">Pickup cancelled. The pieces went back to the listing.</p>

  <p class="empty" th:if="${#lists.isEmpty(incoming)}">No one has taken your materials yet.</p>

  <section class="pk-section" th:unless="${#lists.isEmpty(incoming)}">
    <h2>Pickups from my listings <span class="pk-count" th:text="${#lists.size(incoming)}">0</span></h2>

    <article class="card pk-row" th:each="c : ${incoming}">
      <a class="pk-thumb" th:href="@{/listings/{id}(id=${c.material.id})}" tabindex="-1" aria-hidden="true">
        <img th:if="${c.material.imageUrl != null}" th:src="@{${c.material.imageUrl}}" alt="">
        <span class="noimg" th:unless="${c.material.imageUrl != null}">No photo</span>
      </a>
      <div>
        <h3><a th:href="@{/listings/{id}(id=${c.material.id})}" th:text="${c.material.name}">Name</a></h3>
        <p class="muted" th:text="${c.quantity + ' ' + c.material.unit + ' for ' + c.requester.fullName}">1 pcs for Buyer</p>
      </div>
      <span th:class="'badge s-' + ${#strings.toLowerCase(c.state.name())}" th:text="${c.state.label}">Pending pickup</span>
      <div class="pk-handover" th:if="${c.pending}">
        <form method="post" th:action="@{/claims/{id}/pickup(id=${c.id})}" class="pk-codeform">
          <button class="btn small" type="submit">Mark as picked up</button>
        </form>
        <form method="post" th:action="@{/claims/{id}/cancel(id=${c.id})}">
          <button class="btn small ghost danger" type="submit">Cancel</button>
        </form>
      </div>
      <span class="muted" th:unless="${c.pending}"
            th:text="${c.closedAt != null ? #temporals.format(c.closedAt, 'dd MMM, HH:mm') : ''}"></span>
    </article>
  </section>
</main>
</body>
</html>
