<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Find materials')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="narrow">
  <h1>What do you need?</h1>
  <p class="muted">Enter your project's requirements. We'll show the materials that fit best.</p>
  <form method="post" th:action="@{/requests}" class="form">
    <label class="field">Material name/type<input name="name" required placeholder="e.g. 2x4 lumber"></label>
    <label class="field">Category
      <select name="category"><option th:each="c : ${categories}" th:value="${c}" th:text="${c.label}"></option></select>
    </label>
    <div class="two">
      <label class="field">Required length (cm)<input type="number" step="any" min="0" name="lengthCm"></label>
      <label class="field">Required width (cm)<input type="number" step="any" min="0" name="widthCm"></label>
    </div>
    <label class="field">Quantity needed<input type="number" min="1" name="quantity" value="1" required></label>
    <label class="field">Lowest acceptable condition
      <select name="desiredCondition"><option th:each="c : ${conditions}" th:value="${c}" th:text="${c.label}" th:selected="${c.name() == 'GOOD'}"></option></select>
    </label>
    <label class="field">Location
      <select name="location">
        <option th:each="l : ${locations}" th:value="${l}" th:text="${l}" th:selected="${l == me.location}"></option>
      </select>
    </label>
    <button class="btn" type="submit">Find matches</button>
  </form>
</main>
</body>
</html>
