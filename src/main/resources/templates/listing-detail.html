<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Material details')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
  <p><a class="btn ghost back" th:href="@{/listings}"><span aria-hidden="true">&larr;</span> Back to list</a></p>
  <div class="detail">
    <div>
      <img class="photo" th:if="${m.imageUrl != null}" th:src="@{${m.imageUrl}}" alt="">
      <div class="noimg big" th:unless="${m.imageUrl != null}">No photo</div>
    </div>
    <div>
      <h1 th:text="${m.name}">Name</h1>
      <p><span th:class="'badge s-' + ${#strings.toLowerCase(m.status.name())}" th:text="${m.status.label}">Available</span>
         <span class="badge s-reported" th:if="${m.reported}">Reported</span></p>
      <table class="table spec">
        <tr><th>Category</th><td th:text="${m.category.label}"></td></tr>
        <tr><th>Size (length × width)</th><td th:text="${m.size}"></td></tr>
        <tr><th>Quantity left</th><td><strong th:text="${m.quantity + ' ' + m.unit}"></strong><span class="muted" th:if="${takenTotal > 0}" th:text="' (' + ${takenTotal} + ' already taken)'"></span></td></tr>
        <tr><th>Condition</th><td th:text="${m.matCondition.label}"></td></tr>
        <tr><th>Location</th><td th:text="${m.location}"></td></tr>
        <tr><th>Provider</th><td th:text="${m.owner.fullName}"></td></tr>
        <tr><th>Posted</th><td th:text="${#temporals.format(m.createdAt, 'dd MMM yyyy')}"></td></tr>
      </table>
      <p th:if="${m.description != null and !m.description.isBlank()}" th:text="${m.description}"></p>

      <p class="notice ok" th:if="${param.taken != null}" th:text="'You took ' + ${param.taken[0]} + ' ' + ${m.unit} + '. The provider has been notified. Message them to arrange the pickup.'"></p>
      <p class="error" th:if="${param.err != null}"
         th:text="${param.err[0] == 'toomany' ? 'Only ' + m.quantity + ' ' + m.unit + ' left. Enter a smaller number.' : param.err[0] == 'qty' ? 'Enter at least 1.' : param.err[0] == 'own' ? 'You cannot take your own listing.' : 'This material is no longer available.'}"></p>

      <form th:if="${!isOwner and m.status.name() == 'AVAILABLE' and m.quantity > 0}" method="post"
            th:action="@{/listings/{id}/take(id=${m.id})}" class="takeform">
        <label class="field">How many do you need?
          <span class="qtybox">
            <input type="number" name="quantity" min="1" th:max="${m.quantity}" value="1" required>
            <span class="muted" th:text="${m.unit} + ' (max ' + ${m.quantity} + ')'"></span>
          </span>
        </label>
        <button class="btn" type="submit">Take this quantity</button>
      </form>
      <p class="muted" th:if="${myTaken > 0}" th:text="'You have taken ' + ${myTaken} + ' ' + ${m.unit} + ' from this listing.'"></p>

      <p th:if="${isOwner}"><a class="btn small" th:href="@{/listings/{id}/edit(id=${m.id})}">Edit listing</a></p>

      <form th:if="${canManage}" method="post" th:action="@{/listings/{id}/status(id=${m.id})}" class="inlineform">
        <label class="field">Update availability
          <select name="status">
            <option th:each="st : ${statuses}" th:if="${st.name() != 'REMOVED' or me.role.name() == 'ADMIN'}"
                    th:value="${st}" th:text="${st.label}" th:selected="${m.status == st}"></option>
          </select>
        </label>
        <button class="btn small" type="submit">Save</button>
      </form>

      <form th:if="${!isOwner}" method="post" th:action="@{/listings/{id}/report(id=${m.id})}" class="inline">
        <button class="link danger" type="submit">Report listing</button>
      </form>
    </div>
  </div>

  <section th:if="${canManage and !#lists.isEmpty(claimList)}" class="panel">
    <h2>Taken so far</h2>
    <p class="muted"><a th:href="@{/claims}">Manage pickups</a></p>
    <table class="table">
      <thead><tr><th>Who</th><th>Quantity</th><th>Status</th><th>Date</th></tr></thead>
      <tbody><tr th:each="c : ${claimList}">
        <td th:text="${c.requester.fullName}">Name</td>
        <td th:text="${c.quantity + ' ' + m.unit}">1</td>
        <td><span th:class="'badge s-' + ${#strings.toLowerCase(c.state.name())}" th:text="${c.state.label}">Pending</span></td>
        <td th:text="${#temporals.format(c.createdAt, 'dd MMM yyyy HH:mm')}">Date</td>
      </tr></tbody>
    </table>
  </section>

  <section th:if="${!isOwner and m.status.name() != 'REMOVED'}" class="panel" id="ask">
    <h2>Ask the provider</h2>
    <form method="post" th:action="@{/messages/send}" class="form">
      <input type="hidden" name="listingId" th:value="${m.id}">
      <input type="hidden" name="recipientId" th:value="${m.owner.id}">
      <input type="hidden" name="back" value="listing">
      <label class="field">Message<textarea name="content" rows="3" required placeholder="e.g. I'd like to pick this up on Saturday, is that okay?"></textarea></label>
      <button class="btn" type="submit">Send</button>
    </form>
  </section>
</main>
</body>
</html>
