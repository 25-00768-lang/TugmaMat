<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Log in')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="narrow">
  <h1>Log in</h1>
  <p class="error" th:if="${error}" th:text="${error}"></p>
  <form method="post" th:action="@{/login}" class="form">
    <label class="field">Email<input type="email" name="email" required autofocus></label>
    <label class="field">Password<input type="password" name="password" required></label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted">No account yet? <a th:href="@{/register}">Sign up</a></p>
  <details class="demo">
    <summary>Demo accounts</summary>
    <p><strong>Provider:</strong> provider@tugmamat.ph / provider123<br>
       <strong>Requester:</strong> requester@tugmamat.ph / requester123<br>
       <strong>Admin:</strong> admin@tugmamat.ph / admin123</p>
  </details>
</main>
</body>
</html>
