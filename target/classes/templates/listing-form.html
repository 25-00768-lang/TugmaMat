<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${m == null ? 'Post a material' : 'Edit listing'})}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="narrow">
  <h1 th:text="${m == null ? 'Post a leftover material' : 'Edit listing'}">Post a leftover material</h1>
  <form method="post" th:action="@{${m == null ? '/listings' : '/listings/' + m.id + '/edit'}}" enctype="multipart/form-data" class="form">
    <label class="field">Material name
      <input name="name" required placeholder="e.g. Wood 2x4 lumber" th:value="${m != null ? m.name : ''}"></label>
    <label class="field">Category
      <select name="category">
        <option th:each="c : ${categories}" th:value="${c}" th:text="${c.label}" th:selected="${m != null and m.category == c}"></option>
      </select>
    </label>
    <div class="two">
      <label class="field">Length (cm)<input type="number" step="any" min="0" name="lengthCm" th:value="${m != null ? m.lengthCm : null}"></label>
      <label class="field">Width (cm)<input type="number" step="any" min="0" name="widthCm" th:value="${m != null ? m.widthCm : null}"></label>
    </div>
    <div class="two">
      <label class="field">Quantity<input type="number" min="1" name="quantity" required th:value="${m != null ? m.quantity : 1}"></label>
      <label class="field">Unit<input name="unit" required th:value="${m != null ? m.unit : 'pcs'}"></label>
    </div>
    <label class="field">Condition
      <select name="condition">
        <option th:each="c : ${conditions}" th:value="${c}" th:text="${c.label}"
                th:selected="${m != null ? m.matCondition == c : c.name() == 'GOOD'}"></option>
      </select>
    </label>
    <label class="field">Pickup location
      <select name="location" th:with="cur=${m != null ? m.location : me.location}">
        <option th:if="${cur != null and !cur.isBlank() and !locations.contains(cur)}" th:value="${cur}" th:text="${cur}" selected></option>
        <option th:each="l : ${locations}" th:value="${l}" th:text="${l}" th:selected="${l == cur}"></option>
      </select>
    </label>
    <label class="field">Description
      <textarea name="description" rows="3" placeholder="Anything the person picking up should know: scratches, wet, color..." th:text="${m != null ? m.description : ''}"></textarea></label>
    <div th:if="${m != null and m.imageUrl != null}">
      <p class="muted">Current photo:</p>
      <img class="photo" style="max-width:240px" th:src="@{${m.imageUrl}}" alt="">
    </div>
    <label class="field"><span th:text="${m != null ? 'Replace photo (optional, jpg, png, webp, up to 5MB)' : 'Photo (jpg, png, webp, up to 5MB)'}">Photo</span>
      <input type="file" name="image" accept=".jpg,.jpeg,.png,.webp"></label>
    <div class="actions">
      <button class="btn" type="submit" th:text="${m == null ? 'Post material' : 'Save changes'}">Post material</button>
      <a class="btn ghost" th:if="${m != null}" th:href="@{/listings/{id}(id=${m.id})}">Cancel</a>
    </div>
  </form>
</main>
</body>
</html>
